<!-- BLOQUE IDENTIFICARME: acceso a la cuenta del cliente, con estilos propios. -->
<div class="formulario-registro formulario-identificar">
    <p class="identificar-eyebrow">TZAA JAA! · PERFUMERÍA</p>
    <h2>Identificarme</h2>
    <p>Accede a tu cuenta para añadir perfumes al carrito.</p>

    <!-- Formulario enlazado al inicio de sesión existente. -->
    <form id="form_login">
        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="tu correo electrónico" required>
        </div>

        <div>
            <label for="pass">Contraseña:</label>
            <input type="password" id="pass" name="pass" autocomplete="current-password" placeholder="Tu contraseña" required>
        </div>

        <button type="submit">IDENTIFICARME</button>
    </form>

</div>
