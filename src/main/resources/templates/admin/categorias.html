<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de categorías | Perfumería</title>
    <link rel="stylesheet" href="/css/administracion.css?v=20261029c">
    <link rel="stylesheet" href="/css/idioma-admin.css?v=20261103">
</head>
<body>
    <div th:replace="~{fragments/admin :: selectorIdioma}"></div>

<div class="categorias-pagina">

    <a class="categorias-volver" th:href="@{/admin/inicioAdmin}">
        ← Volver a administración
    </a>

    <div class="categorias-cabecera">
        <div>
            <p class="categorias-etiqueta">Administración · Perfumería</p>
            <h1 class="categorias-titulo">Gestión de categorías</h1>
            <p class="categorias-descripcion">
                Organiza las categorías de perfumes de tu tienda.
            </p>
        </div>

        <a class="categorias-boton" th:href="@{/admin/categorias/nueva}">
            + Nueva categoría
        </a>
    </div>

    <div class="categorias-tabla-contenedor">
        <table class="categorias-tabla">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="categoria : ${categorias}">
                <td class="categorias-id" th:text="${categoria.id}"></td>
                <td class="categorias-nombre" th:text="${categoria.nombre}"></td>
                <td th:text="${categoria.descripcion}"></td>
                <td>
                    <div class="categorias-acciones">
                        <a class="categorias-editar"
                           th:href="@{/admin/categorias/editar/{id}(id=${categoria.id})}">
                            Editar
                        </a>

                        <a class="categorias-eliminar"
                           th:href="@{/admin/categorias/eliminar/{id}(id=${categoria.id})}"
                           onclick="return confirm('¿Seguro que quieres eliminar esta categoría?')">
                            Eliminar
                        </a>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="4" class="categorias-vacio">
                    Todavía no hay categorías registradas.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

    <script src="/javascript/idioma.js?v=20261103admin"></script>
</body>
</html>
